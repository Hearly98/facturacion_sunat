<c-row>
    <c-col xs="12">
        <c-card class="mb-4">
            <c-card-body>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">{{ title }}</h4>
                    <button cButton color="secondary" variant="ghost" [routerLink]="['/almacenes']">
                        <svg cIcon name="cil-arrow-left" class="me-2"></svg>
                        Volver
                    </button>
                </div>

                <div class="row g-3 mb-4" [formGroup]="filterForm">
                    <c-col md="6">
                        <label cLabel>Buscar Producto</label>
                        <input cFormControl type="text" formControlName="nombre"
                            placeholder="Nombre o código del producto..." (input)="onSearch()" />
                    </c-col>
                    <c-col md="4" class="d-flex align-items-end gap-2">
                        <button (click)="onSearch()" cButton color="primary">
                            <svg cIcon name="cil-search" class="me-2"></svg>
                            Buscar
                        </button>
                        <button (click)="clearSearch()" cButton color="secondary">
                            <svg cIcon name="cilX"></svg>
                            Limpiar
                        </button>
                    </c-col>
                </div>

                <div class="table-responsive">
                    <table [hover]="true" [striped]="true" cTable>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Código</th>
                                <th>Producto</th>
                                <th class="text-center">Stock</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of filteredProductos; let i = index">
                                <td>{{ i + 1 }}</td>
                                <td>{{ item.producto?.internalCode || 'N/A' }}</td>
                                <td>{{ item.producto?.name || 'N/A' }}</td>
                                <td class="text-center">
                                    <span class="badge" [ngClass]="item.stockActual <= 5 ? 'bg-danger' : 'bg-success'">
                                        {{ item.stockActual }}
                                    </span>
                                </td>
                                <td>
                                    <span class="badge" [ngClass]="item.activo ? 'bg-success' : 'bg-danger'">
                                        {{ item.activo ? 'Activo' : 'Inactivo' }}
                                    </span>
                                </td>
                            </tr>
                            <tr *ngIf="filteredProductos.length === 0">
                                <td colspan="5" class="text-center py-3">
                                    No hay productos vinculados a este almacén
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-3 d-flex justify-content-between align-items-center">
                    <span class="text-muted">
                        Total: {{ filteredProductos.length }} productos
                    </span>
                </div>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
