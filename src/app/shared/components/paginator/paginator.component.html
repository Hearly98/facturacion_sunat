<c-row class="mt-2 align-items-center">
  <c-col sm="6">
    <nav aria-label="Page navigation">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="page === 1">
          <button class="page-link" (click)="onPageChange(page - 1)" [disabled]="page === 1" aria-label="Anterior">
            &lsaquo;
          </button>
        </li>
        @for (p of pageNumbers; track $index) {
          @if (p === '...') {
            <li class="page-item disabled">
              <span class="page-link">&hellip;</span>
            </li>
          } @else {
            <li class="page-item" [class.active]="p === page">
              <button class="page-link" (click)="onPageChange(p)">{{ p }}</button>
            </li>
          }
        }
        <li class="page-item" [class.disabled]="page === totalPages">
          <button
            class="page-link"
            (click)="onPageChange(page + 1)"
            [disabled]="page === totalPages"
            aria-label="Siguiente"
          >
            &rsaquo;
          </button>
        </li>
      </ul>
    </nav>
  </c-col>
  <c-col sm="6" class="text-end">
    @if (total > 0) {
      <span class="ml-2">{{ firstItem }}-{{ lastItem }} de {{ total }}</span>
    }
  </c-col>
</c-row>
