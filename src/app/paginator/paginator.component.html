<c-row class="mt-2">
  <c-col sm="6">
    <nav aria-label="Page navigation">
      <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="page === 1">
          <button class="page-link" (click)="onPageChange(1)" [disabled]="page === 1">
            Primera
          </button>
        </li>
        <li class="page-item" [class.disabled]="page === 1">
          <button class="page-link" (click)="onPageChange(page - 1)" [disabled]="page === 1">
            Anterior
          </button>
        </li>
        <li class="page-item active">
          <span class="page-link">
            Página {{ page }} de {{ totalPages() }}
          </span>
        </li>
        <li class="page-item" [class.disabled]="page === totalPages()">
          <button class="page-link" (click)="onPageChange(page + 1)" [disabled]="page === totalPages()">
            Siguiente
          </button>
        </li>
        <li class="page-item" [class.disabled]="page === totalPages()">
          <button class="page-link" (click)="onPageChange(totalPages())" [disabled]="page === totalPages()">
            Última
          </button>
        </li>
      </ul>
    </nav>
  </c-col>
  <c-col sm="6" class="text-end">
    @if (total > 0) {
      <span class="ml-2">
        Mostrando {{ firstItem() }}-{{ lastItem() }} de {{ total }} registros
      </span>
    } @else {
      <span class="ml-2">Sin registros</span>
    }
  </c-col>
</c-row>
